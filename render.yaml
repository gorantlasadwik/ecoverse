services:
  - type: web
    name: smart-irrigation-app
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: AGROMONITORING_API_KEY
        sync: false
    healthCheckPath: /health
    autoDeploy: true
